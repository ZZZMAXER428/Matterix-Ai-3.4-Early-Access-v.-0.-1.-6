<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATTERIX AI 4.1 v.0.1.7 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    background: #0c0f17;
    color: white;
    font-family: "Poppins", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  header {
    width: 100%;
    text-align: center;
    padding: 12px 0;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    background: #000;
    text-shadow: 0 0 8px #00ffff, 0 0 12px #00ff6a;
    animation: glow 2s infinite alternate;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  @keyframes glow {
    from { text-shadow: 0 0 8px #00ffff, 0 0 12px #00ff6a; }
    to { text-shadow: 0 0 12px #00ff6a, 0 0 20px #00ffff; }
  }
  .menu-btn {
    position: absolute;
    left: 15px;
    font-size: 24px;
    cursor: pointer;
    color: #fff;
    user-select: none;
    z-index: 10;
  }
  .sidebar-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    z-index: 90;
  }
  .sidebar {
    position: fixed;
    top: 0;
    left: -280px;
    width: 270px;
    height: 100vh;
    background: #121622;
    border-right: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 4px 0 15px rgba(0, 255, 255, 0.1);
    transition: left 0.3s ease;
    z-index: 100;
    display: flex;
    flex-direction: column;
    padding: 15px;
  }
  .sidebar.active { left: 0; }
  .new-chat-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    background: linear-gradient(45deg, #00ffa8, #00e0ff);
    color: #000;
    font-weight: bold;
    border: none;
    cursor: pointer;
    font-size: 15px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0, 255, 168, 0.3);
  }
  .history-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .history-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    font-size: 14px;
    color: #ccc;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
    user-select: none;
    -webkit-user-select: none;
    transition: 0.2s;
  }
  .history-item.active {
    background: rgba(0, 224, 255, 0.15);
    border-color: #00e0ff;
    color: #fff;
  }
  .history-item:hover { background: rgba(255, 255, 255, 0.1); }
  .chat-container {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 18px rgba(0, 255, 255, 0.2);
    border-radius: 18px;
    width: 95%;
    max-width: 600px;
    height: 70vh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    overflow-y: auto;
    scroll-behavior: smooth;
    margin-top: 10px;
  }
  .bubble {
    max-width: 85%;
    margin: 6px 0;
    padding: 10px 14px;
    border-radius: 25px;
    line-height: 1.5em;
    word-wrap: break-word;
    white-space: pre-line;
  }
  .user {
    background: linear-gradient(45deg, #00e0ff, #00ffa8);
    align-self: flex-end;
    color: black;
  }
  .ai {
    background: rgba(255,255,255,0.1);
    align-self: flex-start;
    border: 1px solid rgba(255,255,255,0.2);
    color: #dff;
  }
  .typing-box {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    color: #00ffff;
    font-size: 14px;
  }
  .dot {
    width: 6px;
    height: 6px;
    background: #00ffff;
    border-radius: 50%;
    animation: blink 1.5s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }
  .input-area {
    display: flex;
    align-items: center;
    margin-top: 10px;
    width: 95%;
    max-width: 600px;
  }
  input {
    flex: 1;
    border: none;
    border-radius: 50px;
    padding: 10px 16px;
    font-size: 15px;
    background: #161a22;
    color: white;
    outline: none;
  }
  button.send-btn {
    margin-left: 8px;
    padding: 10px 16px;
    border-radius: 50px;
    background: linear-gradient(45deg, #00ffa8, #00e0ff);
    color: #000;
    border: none;
    font-weight: bold;
    cursor: pointer;
  }
  .global-timer {
    font-size: 13px;
    margin-top: 6px;
    color: #aaa;
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 300;
  }
  .modal-box {
    background: #191e2b;
    border: 1px solid rgba(0, 255, 255, 0.3);
    border-radius: 16px;
    padding: 20px;
    width: 80%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
  }
  .modal-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #fff;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .modal-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-delete {
    background: #ff4d4d;
    color: white;
  }
  .btn-cancel {
    background: rgba(255, 255, 255, 0.1);
    color: #ccc;
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
  <div class="history-title">Chat History</div>
  <div class="history-list" id="historyList"></div>
</div>

<header>
  <span class="menu-btn" id="menuBtn">☰</span>
  01 MATTERIX AI🤖
</header>

<div class="chat-container" id="chat">
  <div class="bubble ai">Hi, I'm Matterix Ai 👋</div>
</div>

<div class="typing-box" id="typingBox">
  <span>AI thinking</span>
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <span class="timer">0.00s</span>
</div>

<div class="global-timer">
  Previous Response Time: <span class="time">0.00s</span>
</div>

<div class="input-area">
  <input id="userInput" placeholder="Ask Matterix Ai Anything..." autocomplete="off" />
  <button class="send-btn" id="askBtn">Ask ↑</button>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal-box">
    <div class="modal-title">Delete Chat?</div>
    <div class="modal-actions">
      <button class="modal-btn btn-cancel" id="cancelDeleteBtn">Cancel</button>
      <button class="modal-btn btn-delete" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<script>
// Base64 Encoded Key
const ENCRYPTED_API_KEY = "QVEuQWI4Uk42Sl9qeHoxcFRHcFlhVG9HdS03UDdPQVh4MDRHV3lBSE5RWlF1Vmw3c1BCV0E=";

function getActiveKey() {
  try {
    return decodeURIComponent(atob(ENCRYPTED_API_KEY));
  } catch (e) {
    console.error("Decoding error, fallback to original:", e);
    return ENCRYPTED_API_KEY;
  }
}

const chatBox = document.getElementById("chat");
const input = document.getElementById("userInput");
const askBtn = document.getElementById("askBtn");
const typingBox = document.getElementById("typingBox");
const localTimer = typingBox.querySelector(".timer");
const responseTimeDisplay = document.querySelector(".global-timer .time");

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const newChatBtn = document.getElementById("newChatBtn");
const historyList = document.getElementById("historyList");

const deleteModal = document.getElementById("deleteModal");
const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

let localStart, localInterval;
let allSessions = JSON.parse(localStorage.getItem("matterix_sessions")) || {};
let currentSessionId = null;
let targetDeleteId = null;
let chatHistory = [];

function initSession() {
  const keys = Object.keys(allSessions);
  if (keys.length > 0) {
    loadSession(keys[0]);
  } else {
    createNewChat();
  }
  renderHistory();
}

function createNewChat() {
  currentSessionId = "chat_" + Date.now();
  chatHistory = [];
  allSessions[currentSessionId] = {
    title: "New Conversation",
    history: [],
    html: `<div class="bubble ai">Hi, I'm Matterix Ai 👋</div>`
  };
  saveSessions();
  renderHistory();
  loadSession(currentSessionId);
}

function saveSessions() {
  localStorage.setItem("matterix_sessions", JSON.stringify(allSessions));
}

function loadSession(id) {
  if (!allSessions[id]) return;
  currentSessionId = id;
  chatHistory = allSessions[id].history || [];
  chatBox.innerHTML = allSessions[id].html || `<div class="bubble ai">Hi, I'm Matterix Ai 👋</div>`;
  renderHistory();
  closeSidebar();
}

function openDeleteModal(id) {
  targetDeleteId = id;
  deleteModal.style.display = "flex";
}

function closeDeleteModal() {
  targetDeleteId = null;
  deleteModal.style.display = "none";
}

confirmDeleteBtn.onclick = () => {
  if (targetDeleteId && allSessions[targetDeleteId]) {
    delete allSessions[targetDeleteId];
    saveSessions();
    const remainingKeys = Object.keys(allSessions);
    if (targetDeleteId === currentSessionId) {
      if (remainingKeys.length > 0) {
        loadSession(remainingKeys[0]);
      } else {
        createNewChat();
      }
    } else {
      renderHistory();
    }
  }
  closeDeleteModal();
};

cancelDeleteBtn.onclick = closeDeleteModal;

function saveCurrentState() {
  if (!currentSessionId || !allSessions[currentSessionId]) return;
  allSessions[currentSessionId].history = chatHistory;
  allSessions[currentSessionId].html = chatBox.innerHTML;
  if (allSessions[currentSessionId].title === "New Conversation" && chatHistory.length > 0) {
    const firstText = chatHistory[0].parts[0].text;
    allSessions[currentSessionId].title = firstText.length > 20 ? firstText.substring(0, 20) + "..." : firstText;
  }
  saveSessions();
  renderHistory();
}

function renderHistory() {
  historyList.innerHTML = "";
  Object.keys(allSessions).reverse().forEach(id => {
    const item = document.createElement("div");
    item.className = "history-item " + (id === currentSessionId ? "active" : "");
    item.textContent = allSessions[id].title;

    let pressTimer = null;
    let isLongPress = false;

    item.addEventListener("touchstart", (e) => {
      isLongPress = false;
      pressTimer = setTimeout(() => {
        isLongPress = true;
        openDeleteModal(id);
      }, 600);
    });

    item.addEventListener("touchend", () => clearTimeout(pressTimer));
    item.addEventListener("touchmove", () => clearTimeout(pressTimer));

    item.oncontextmenu = (e) => {
      e.preventDefault();
      openDeleteModal(id);
    };

    item.onclick = () => {
      if (!isLongPress) {
        loadSession(id);
      }
    };

    historyList.appendChild(item);
  });
}

menuBtn.onclick = () => {
  sidebar.classList.add("active");
  overlay.style.display = "block";
};
overlay.onclick = closeSidebar;

function closeSidebar() {
  sidebar.classList.remove("active");
  overlay.style.display = "none";
}

newChatBtn.onclick = createNewChat;

function startTimers() {
  typingBox.style.display = "flex";
  localStart = Date.now();
  localInterval = setInterval(() => {
    const elapsed = ((Date.now() - localStart) / 1000).toFixed(2);
    localTimer.textContent = elapsed + "s";
  }, 100);
}

function stopTimers() {
  typingBox.style.display = "none";
  clearInterval(localInterval);
  if (localStart) {
    const elapsed = (Date.now() - localStart) / 1000;
    responseTimeDisplay.textContent = elapsed.toFixed(2) + "s";
  }
}

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });
  saveCurrentState();
  return div;
}

function triggerSend() {
  const val = input.value.trim();
  if (!val) return;
  askMatterix(val);
  input.value = "";
}

async function askMatterix(q) {
  addMessage(q, "user");
  startTimers();

  chatHistory.push({ role: "user", parts: [{ text: q }] });

  const activeKey = getActiveKey();

  try {
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + activeKey,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: chatHistory })
      }
    );
    
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || "API error");
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Response error";
    
    addMessage(text, "ai");
    chatHistory.push({ role: "model", parts: [{ text }] });
  } catch (err) {
    addMessage("⚠️ " + err.message, "ai");
  } finally {
    stopTimers();
    saveCurrentState();
  }
}

askBtn.addEventListener("click", triggerSend);
input.addEventListener("keypress", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    triggerSend();
  }
});

initSession();
</script>
</body>
</html>
