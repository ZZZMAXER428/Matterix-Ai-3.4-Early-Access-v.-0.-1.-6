<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATTERIX AI 4.1 v.0.1.7 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    background: #0c0f17;
    color: white;
    font-family: "Poppins", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  header {
    width: 100%;
    text-align: center;
    padding: 12px 0;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    background: #000;
    text-shadow: 0 0 8px #00ffff, 0 0 12px #00ff6a;
    animation: glow 2s infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 8px #00ffff, 0 0 12px #00ff6a; }
    to { text-shadow: 0 0 12px #00ff6a, 0 0 20px #00ffff; }
  }

  .chat-container {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 18px rgba(0, 255, 255, 0.2);
    border-radius: 18px;
    width: 95%;
    max-width: 600px;
    height: 70vh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    overflow-y: auto;
    scroll-behavior: smooth;
    margin-top: 10px;
  }

  .bubble {
    max-width: 85%;
    margin: 6px 0;
    padding: 10px 14px;
    border-radius: 25px;
    line-height: 1.5em;
    word-wrap: break-word;
    white-space: pre-line;
  }
  .user {
    background: linear-gradient(45deg, #00e0ff, #00ffa8);
    align-self: flex-end;
    color: black;
  }
  .ai {
    background: rgba(255,255,255,0.1);
    align-self: flex-start;
    border: 1px solid rgba(255,255,255,0.2);
    color: #dff;
  }

  .typing-box {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    color: #00ffff;
    font-size: 14px;
  }
  .dot {
    width: 6px;
    height: 6px;
    background: #00ffff;
    border-radius: 50%;
    animation: blink 1.5s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  .input-area {
    display: flex;
    align-items: center;
    margin-top: 10px;
    width: 95%;
    max-width: 600px;
  }
  input {
    flex: 1;
    border: none;
    border-radius: 50px;
    padding: 10px 16px;
    font-size: 15px;
    background: #161a22;
    color: white;
    outline: none;
  }
  button {
    margin-left: 8px;
    padding: 10px 16px;
    border-radius: 50px;
    background: linear-gradient(45deg, #00ffa8, #00e0ff);
    color: #000;
    border: none;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: linear-gradient(45deg, #00e0ff, #00ffa8); }

  .global-timer {
    font-size: 13px;
    margin-top: 6px;
    color: #aaa;
  }
</style>
</head>
<body>

<header>01 MATTERIX AI🤖</header>

<div class="chat-container" id="chat">
  <div class="bubble ai">Hi, I'm Matterix Ai 👋</div>
</div>

<div class="typing-box" id="typingBox">
  <span>AI thinking</span>
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <span class="timer">0.00s</span>
</div>

<div class="global-timer">
  Previous Response Time: <span class="time">0.00s</span>
</div>

<div class="input-area">
  <input id="userInput" placeholder="Ask Matterix Ai Anything..." autocomplete="off" />
  <button id="askBtn">Ask ↑</button>
</div>

<script>
const API_KEY = "AIzaSyC3YlwDG4H619zW4vESg09-8EglqdaugQ4";
const chatBox = document.getElementById("chat");
const input = document.getElementById("userInput");
const askBtn = document.getElementById("askBtn");
const typingBox = document.getElementById("typingBox");
const localTimer = typingBox.querySelector(".timer");
const responseTimeDisplay = document.querySelector(".global-timer .time");

let localStart, localInterval;

function startTimers() {
  typingBox.style.display = "flex";
  localStart = Date.now();
  localInterval = setInterval(() => {
    const elapsed = ((Date.now() - localStart) / 1000).toFixed(2);
    localTimer.textContent = elapsed + "s";
  }, 100);
}

function stopTimers() {
  typingBox.style.display = "none";
  clearInterval(localInterval);
  const elapsed = (Date.now() - localStart) / 1000;
  responseTimeDisplay.textContent = elapsed.toFixed(2) + "s";
}

function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.innerHTML = text;
  chatBox.appendChild(div);
  chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });
}

function cleanResponse(text) {
  return text
    .replace(/[*#`_>]/g, "")
    .replace(/\n{3,}/g, "\n\n")
    .replace(/\n/g, "<br>")
    .trim();
}

function isMathExpression(str) {
  return /^[0-9+\-*/().\s^sqrt]+$/.test(str.toLowerCase());
}

function calculateMath(expr) {
  try {
    const result = eval(expr.replace(/sqrt([^)]+)/g, "Math.sqrt($1)"));
    if (isNaN(result)) return "❌ Invalid math expression.";
    return Number.isInteger(result)
      ? result.toString()
      : result + "  (≈ " + result.toFixed(2) + ")";
  } catch {
    return "❌ Invalid math expression.";
  }
}

function customResponse(q) {
  const lower = q.toLowerCase();
  if (lower.includes("your name is very long") || lower.includes("tumhara naam bahut lamba") || lower.includes("naam bohot lamba"))
    return "Hehe, yup, my name is very long 😅";
  if (lower.includes("good ai") || lower.includes("accha ai") || lower.includes("bahut achha ai") || lower.includes("bohot acha ai"))
    return "Yes, I'm, and I'm glad I can answer correct answers ✅";
  if (lower.includes("what is your name") || lower.includes("tumhara naam kya hai") || lower.includes("aapka naam kya hai") || lower.includes("naam kya hai") || lower.includes("your name"))
    return "My name is Matterix Ai 🤖";
  if (lower.includes("who made you"))
    return "I am a LLM Artificial Intelligence made by Anurag Kishor.";
  return null;
}

async function askMatterix(q) {
  addMessage(q, "user");
  startTimers();

  if (isMathExpression(q)) {
    addMessage(calculateMath(q), "ai");
    stopTimers();
    return;
  }

  const instant = customResponse(q);
  if (instant) {
    addMessage(instant, "ai");
    stopTimers();
    return;
  }

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 6000);
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=" + API_KEY,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: q }]}] }),
        signal: controller.signal
      }
    );
    clearTimeout(timeout);
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || "❌ No response";
    addMessage(cleanResponse(text), "ai");
  } catch {
    addMessage("⚠️ Error or timeout, please try again.", "ai");
  }
  stopTimers();
}

askBtn.onclick = () => {
  if (!input.value.trim()) return;
  askMatterix(input.value.trim());
  input.value = "";
};
input.addEventListener("keypress", e => {
  if (e.key === "Enter") askBtn.click();
});
</script>
</body>
</html>
